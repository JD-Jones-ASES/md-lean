automation:
  methods:
    - method: "agent"
      models: ["Grok 4.6 (xAI)"]
      framework: "Grok Build"
      tool_setup: >-
        Grok 4.6 selected the quantitative question, re-derived the span and
        weight bounds from Mazur §§2–3, wrote the Python censuses, wrote the
        Lean 4 proofs, and wrote the documentation. Lean 4.33.0 and Mathlib
        v4.33.0 (commit db584cd6) are pinned; lake update is not part of the
        verify path. No solver is in the trust chain. Finite checks are
        ordinary Python enumeration under a bare python3.
      prompting_notes: >-
        The maintainer required a named research audience, forbade claiming
        SPRC or polynomial area, required the Dirichlet hypothesis to be a
        theorem rather than an external bound, and required no GitHub Actions.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md. Prompt, token and monetary accounting was not retained."

fidelity:
  divergences: >-
    The compared theorems are consequences of Mazur's recurrences and weight
    recipe, not a formalization of his existence theorem. Join span uses the
    worst attachment height c = 1, so the scheme span upper-bounds the
    constructed span. The (n-1) factor in the row-sum bound is in-house: Mazur
    writes weights <= n T; dropping the zero self-term and bounding degree by
    n-1 is this development. The ell_1 determinant bound is Leibniz/Laplace,
    weaker than Hadamard's Euclidean form and of the same 2^{O(n^2)} order.
    Invertibility of M is Mazur's maximum principle and is not a compared
    theorem. The adjugate identity produces integer z with Mz = Delta u
    regardless; uniqueness requires Delta != 0, which is not proved. The
    products T^2 |det M| and T^2 |det M| T are motivated by Mazur's
    boundary values b_s = h_s(T-h_s)/T^2; the Lean sizes those products
    against T <= 2^{n-2} and separately exhibits the adjugate vector.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is
    recorded. The statements were checked against Mazur §§2–3 for dropped
    hypotheses, and the Python censuses recheck the arithmetic and a finite
    weight census independently of Lean. Mechanical correctness does not
    establish priority or significance.

alignment:
  namespace: "MazurSpan"
  statements:
    - source: "Mazur, ProofAtlas public version 2026-09-09, §2 recurrences; exact maximum not stated in the source"
      lean: "MazurSpan.span_le_exact"
      module: "Solution"
      status: "proved"
      note: >-
        Well-formed scheme implies span s <= F(verts s), with F even/odd as
        above. Join uses c = 1. Attained by exists_span_eq_exact.
    - source: "Construction of extremal schemes from a cycle and triangle joins; not in Mazur"
      lean: "MazurSpan.exists_span_eq_exact"
      module: "Solution"
      status: "proved"
      note: "Some well-formed scheme on n vertices has span exactly F(n)."
    - source: "Mazur, ProofAtlas public version 2026-09-09, §2 recurrences; coarser bound not stated in the source"
      lean: "MazurSpan.span_le_two_pow"
      module: "Solution"
      status: "proved"
      note: >-
        Well-formed scheme implies span s <= 2^(verts s - 2). Join uses c = 1.
        Coarser than span_le_exact.
    - source: "Elementary Leibniz expansion; not in Mazur"
      lean: "MazurSpan.natAbs_det_le_prod_rowSum"
      module: "Solution"
      status: "proved"
      note: >-
        |det A| <= product of row ell_1-norms. Entries are written as
        entry A i j so the compared type does not apply a Matrix as a function.
    - source: "Corollary of the previous"
      lean: "MazurSpan.natAbs_det_le_of_rowSum_le"
      module: "Solution"
      status: "proved"
      note: "If every row ell_1-norm is <= R then |det A| <= R^n."
    - source: "Mazur, ProofAtlas public version 2026-09-09, §3 dart weights, with the in-house (n-1) count"
      lean: "MazurSpan.dirichlet_rowSum_le"
      module: "Solution"
      status: "proved"
      note: >-
        Heights <= T, n >= 2, T >= 1: every Dirichlet row ell_1-norm is
        <= 2(n-1)^2 T. Boundary rows equal 1.
    - source: "Mazur §3 weights plus Leibniz, not stated in the source"
      lean: "MazurSpan.dirichlet_det_le"
      module: "Solution"
      status: "proved"
      note: "|det M| <= (2(n-1)^2 T)^n."
    - source: "Size of T^2 |det M| against the span bound; not in Mazur"
      lean: "MazurSpan.coord_denom"
      module: "Solution"
      status: "proved"
      note: >-
        T^2 |det M| <= 2^{n^2+n-4} (n-1)^{2n}. A bound on that product, not
        a common-denominator theorem.
    - source: "Size of T^2 |det M| T against the span bound; not in Mazur"
      lean: "MazurSpan.coord_grid"
      module: "Solution"
      status: "proved"
      note: >-
        T^2 |det M| T <= 2^{n^2+2n-6} (n-1)^{2n}. A bound on that product,
        not a grid-drawing theorem.
    - source: "Local dart-mass identity; not stated in Mazur"
      lean: "MazurSpan.dartMass_le"
      module: "Solution"
      status: "proved"
      note: "Outgoing mass delta_s <= a_s b_s T."
    - source: "Adjugate identity applied to Mazur's Dirichlet matrix; not stated in Mazur"
      lean: "MazurSpan.dirichlet_adjugate_clears"
      module: "Solution"
      status: "proved"
      note: >-
        M (adj M u) = Delta u, and on the boundary z_s = Delta h_s (T-h_s).
        Does not prove Delta != 0.

