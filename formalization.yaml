  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05C10", "05C62"]

sources:
  - title: "A Proof of the Strong Papadimitriou–Ratajczak Conjecture"
    authors: ["Lech Mazur"]
    type: "paper"
    location: "https://proofatlas.ai/papers/strong-papadimitriou-ratajczak-conjecture/Strong_Papadimitriou_Ratajczak_Conjecture_Proof_2026-09-09.pdf"
    id: "https://proofatlas.ai/formalizations/strong-papadimitriou-ratajczak-conjecture/"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      Public version of 2026-09-09, 15 pages, hosted by ProofAtlas with
      rightsholder authorization. Canonical page:
      https://proofatlas.ai/formalizations/strong-papadimitriou-ratajczak-conjecture/
      Announced by the author on X, 2026-09-12,
      https://x.com/LechMazur/status/2098915169799733339
      Adapted, not formalized as stated: the paper proves existence of a convex
      greedy drawing via integer heights (§2) and a Dirichlet horizontal
      coordinate (§3), and explicitly does not bound heights or coordinate bit
      length. This development re-implements the height recurrences and the
      dart-weight recipe, proves the exact scheme maximum F(n) (worst-case
      join attachment c = 1), proves the interior-weight row-sum bound with the
      in-house (n-1) count, proves the local dart-mass bound, proves the
      adjugate identity Mz = Delta u, and bounds the products T^2 |det M| and
      T^2 |det M| T against the coarser span T <= 2^{n-2}. Mazur's existence
      theorem and his accompanying Lean development are not imported and are
      not claimed. ProofAtlas records the existence Lean as pending
      accepted-result publication; that status is theirs, not this extract's.
  - title: "The strong Papadimitriou–Ratajczak conjecture, open since 2004, is now a theorem"
    authors: ["Lech Mazur"]
    type: "web discussion"
    location: "https://x.com/LechMazur/status/2098915169799733339"
    id: "https://x.com/LechMazur/status/2098915169799733339"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Author announcement on X (@LechMazur), 2026-09-12. Points to the
      ProofAtlas paper and Lean existence development. Background for
      provenance of the PDF; not a source of the span or scaling bounds.
  - title: "On a conjecture related to geometric routing"
    authors: ["Christos H. Papadimitriou", "David Ratajczak"]
    id: "doi:10.1016/j.tcs.2005.06.022"
    type: "paper"
    location: "https://doi.org/10.1016/j.tcs.2005.06.022"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Theoretical Computer Science 344 (2005), 3-14. The weak and strong
      greedy-drawing conjectures that Mazur addresses. Background only: this
      repository does not formalize either conjecture.
  - title: "Some results on greedy embeddings in metric spaces"
    authors: ["Tom Leighton", "Ankur Moitra"]
    id: "doi:10.1007/s00454-009-9227-6"
    type: "paper"
    location: "https://doi.org/10.1007/s00454-009-9227-6"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Discrete Comput. Geom. 44 (2010), 686-705 (FOCS 2008). Euclidean greedy
      embeddings exist for 3-connected planar graphs but need not be planar.
      Cited for the existence/bit-complexity contrast with Mazur's convex
      construction; not a source of the compared bounds.
  - title: "On succinct convex greedy drawing of 3-connected plane graphs"
    authors: ["Xin He", "Huaming Zhang"]
    id: "doi:10.1137/1.9781611973082.115"
    type: "paper"
    location: "https://doi.org/10.1137/1.9781611973082.115"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      SODA 2011. Schnyder drawings of triangulations are greedy for a metric
      equivalent to Euclidean distance and use O(log n)-bit integer
      coordinates; Euclidean convex greediness together with succinct
      coordinates fails in general. Background for the bit-complexity
      comparison; the compared theorems do not produce a Schnyder drawing.
  - title: "On the area requirements of planar greedy drawings of triconnected planar graphs"
    authors: ["Giordano Da Lozzo", "Anthony D'Angelo", "Fabrizio Frati"]
    id: "arXiv:2003.00556"
    type: "paper"
    location: "https://arxiv.org/abs/2003.00556"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      GD 2020; arXiv:2003.00556. Polynomial-size grids for planar Euclidean
      greedy drawings of all 3-connected planar graphs are open. Cao,
      Strelzoff, and Sun's exponential-area claim for a specific family is
      refuted there: those graphs have convex greedy drawings on an
      O(n) x O(n) grid; Halin graphs likewise. Some alpha-Schnyder drawings
      require exponential area. This is the comparison class for Mazur's
      Euclidean convex construction; the compared theorems bound recurrences
      and |det M|, not drawing area.

