status:
  scope: >-
    Eleven compared theorems over the compared definitions, plus the inductive
    type Scheme. span_le_exact and exists_span_eq_exact are the exact
    one-parameter scheme maximum F(n). span_le_two_pow is the coarser
    height-span bound. natAbs_det_le_prod_rowSum and natAbs_det_le_of_rowSum_le
    are the elementary Leibniz ell_1 determinant bounds. dirichlet_rowSum_le
    and dirichlet_det_le are the dart-weight row-sum and determinant bounds.
    dartMass_le is the local a_s b_s T mass bound. coord_denom and coord_grid
    bound the products T^2 |det M| and T^2 |det M| T against T <= 2^{n-2}.
    dirichlet_adjugate_clears is the adjugate identity Mz = Delta u with
    integer boundary values Delta h (T-h); it does not prove invertibility.
    Not claimed: SPRC; polynomial grid area; that every greedy labeling (as
    opposed to Mazur's recurrences) obeys the span bound; a planar
    degree-budget theorem. Challenge.lean's intentional sorry placeholders
    are excluded from proof counts; Solution.lean does not import
    Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "MazurSpan.span_le_exact"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "MazurSpan.exists_span_eq_exact"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "MazurSpan.span_le_two_pow"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "MazurSpan.dirichlet_det_le"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "MazurSpan.dartMass_le"
      file: "Solution.lean"
      sorry_count: 0
