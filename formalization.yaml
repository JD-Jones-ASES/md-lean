version: "v0.4"

project:
  name: "md-lean: height span and Dirichlet denominator bounds for Mazur's greedy construction"
  description: >-
    Quantitative bounds for the integer heights and Dirichlet coordinates in
    Mazur's 2026 construction of convex greedy drawings, not a proof of the
    strong Papadimitriou–Ratajczak conjecture. Mazur builds injective integer
    heights by inductive recurrences on rooted pieces (edge, cycle, binary
    series, two-range join) and then solves a weighted Dirichlet problem for
    the horizontal coordinate; the paper does not bound the height span or the
    bit length of the coordinates. For a well-formed scheme on n >= 2 vertices,
    the height span satisfies T <= 2^{n-2}. An integer matrix has |det| at most
    the product of its row ell_1-norms, hence |det| <= R^n when every row
    ell_1-norm is at most R. Heights in {0,...,T} force Mazur's interior dart
    weights to be at most (n-1)T, so every Dirichlet row has ell_1-norm at most
    2(n-1)^2 T when T >= 1, and |det M| <= (2(n-1)^2 T)^n. Clearing the common
    denominator Q = T^2 |det M| against the span bound then gives
    Q <= 2^{n^2+n-4} (n-1)^{2n}; after scaling by Q, integer coordinates lie on
    a grid of side 2^{n^2+2n-6} (n-1)^{2n}. Polynomial grid area is not claimed,
    nor is invertibility of M.
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

