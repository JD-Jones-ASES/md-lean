# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "md-lean: exact height span, dart mass, and adjugate scaling for Mazur's greedy construction"
  description: >-
    Exact height-span of Mazur's scheme grammar, a local dart-mass bound, and
    an adjugate identity for the Dirichlet matrix of that construction; not a
    proof of the strong Papadimitriou–Ratajczak conjecture and not a theorem
    that every 3-connected plane graph attains the scheme maximum. Mazur
    builds injective integer heights by inductive recurrences on rooted
    pieces (edge, cycle, binary series, two-range join) and then forms a
    weighted Dirichlet matrix for the horizontal coordinate; the paper does
    not bound the height span or the bit length of the coordinates. For a
    well-formed scheme on n >= 2 vertices with j nontrivial joins,
    T+1 <= 2^j (n-2j), attained at every admissible pair, so the
    one-parameter maximum is F(n) = 2^{n/2}-1 (n even) or
    3 * 2^{(n-3)/2}-1 (n odd). The coarser bound T <= 2^{n-2} remains. An
    integer matrix has |det| at most the product of its row ell_1-norms.
    Heights in {0,...,T} force Mazur's interior dart weights to be at most
    (n-1)T, so every Dirichlet row has ell_1-norm at most 2(n-1)^2 T when
    T >= 1, and |det M| <= (2(n-1)^2 T)^n; locally the outgoing mass is at
    most a_s b_s T. Combining the coarser span bound with the row-sum bound
    sizes T^2 |det M| and T^2 |det M| T. Independently of invertibility,
    z = adj(M) u satisfies Mz = Delta u and z_s = Delta h_s (T-h_s) on the
    boundary. Polynomial-area Euclidean planar greedy drawings of all
    3-connected planar graphs remain open (Da Lozzo–D'Angelo–Frati, GD 2020).
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

